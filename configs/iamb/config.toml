[profiles."jollof-example"]
url = "https://pi-box.rove-lydian.ts.net:8448"
user_id = "@jollof:jollof.chat"

[settings.notifications]
enabled = true


[settings.image_preview]
protocol.type = "kitty"

[settings.sort]
chats = ["unread", "recent"]
rooms = ["unread", "recent"]
dms = ["invite", "unread", "recent"]

[settings]
username_display = "displayname"
# Forward reads to bridges when the focused chat is scrolled to its newest message.
read_receipt_send = true
read_receipt_trigger = "focused"


[macros.normal]
"ge" = ":editor<Enter>"

[dirs]
downloads = "$HOME/Downloads/matrix"

