# https://taskfile.dev/
version: "3"

vars:
  WIN_DIR: win
  WINGET_FILE: "{{.WIN_DIR}}/winget.json"
  SCOOP_FILE: "{{.WIN_DIR}}/scoop.json"
  BRAVE_DIR: "{{.HOME}}/.config/BraveSoftware/Brave-Browser"
  BRAVE_FILE: "{{.BRAVE_DIR}}/Default/Preferences"
  BRAVE_LOCAL_STATE: "{{.BRAVE_DIR}}/Local State"
  REMMINA_PREF: "{{.HOME}}/.config/remmina/remmina.pref"
  CODEX_CONFIG: "{{.HOME}}/.codex/config.toml"
  LUA_LS: "{{.HOME}}/.local/share/nvim/mason/bin/lua-language-server"

tasks:
  hyprland:reload:
    internal: true
    cmds:
      - hyprctl activewindow &>/dev/null && hyprctl reload || true

  os:all:
    desc: Full system rebuild — os:build, dotbot:run, remmina:configure, codex:configure, sheldon:lock, yazi, tmux:tpm, tmux:reload, hyprland:reload
    cmds:
      - task: os:build
      - task: dotbot:run
      - task: remmina:configure
      - task: codex:configure
      - task: llm:keys
      - task: sheldon:lock
      - task: yazi:pkg
      - task: tmux:tpm-setup
      - task: tmux:reload
      - task: brave:apply
      - task: hyprland:reload

  os:build:
    desc: Rebuild NixOS configuration
    cmds:
      - sudo nixos-rebuild switch --flake .
      - task: hyprland:reload
  
  os:remote-build:
    desc: Rebuild NixOS on a target machine
    requires:
      vars: [HOST, TARGET]
    cmds:
      - nixos-rebuild switch --flake .#{{.HOST}} --target-host {{.TARGET}} --ask-sudo-password

  installer:build:
    desc: Build installer ISO
    cmds:
      - rm -rf result
      - nix build .#nixosConfigurations.installer.config.system.build.isoImage

  installer:burn:
    desc: Burn installer ISO to USB
    cmds:
      - sudo caligula burn result/iso/*.iso

  os:clean:
    desc: Clean nix garbage
    cmds:
      - sudo nix-collect-garbage -d
      - nix-collect-garbage -d

  dotbot:run:
    desc: Run dotbot and setup hyprland config
    cmds:
      - git submodule update --init
      - dotbot -c install.conf.yaml
      - task: hyprland:reload

  sheldon:lock:
    desc: Rebuild sheldon plugin lock
    cmds:
      - sheldon lock

  sheldon:update:
    desc: Update sheldon packages
    cmds:
      - sheldon lock --update

  yazi:pkg:
    desc: Reset yazi plugins/flavors and reinstall (avoids stale state from partial pulls)
    cmds:
      - |
        rm -rf \
          configs/yazi/plugins \
          configs/yazi/flavors \
          ~/.local/state/yazi/packages \
          ~/.cache/yazi/packages
      - task: dotbot:run
      - ya pkg install

  lua:check:
    desc: Type-check our Lua configs (yazi + hyprland) with lua-language-server; honours each dir's .luarc.json
    cmds:
      - task: lua:check:yazi
      - task: lua:check:hypr

  lua:check:yazi:
    desc: Type-check the yazi Lua config (third-party plugins/ excluded via .luarc.json ignoreDir)
    cmds:
      # --check always exits 0, so fail the task ourselves unless it reports "no problems found"
      - |
        out=$("{{.LUA_LS}}" --check configs/yazi 2>&1)
        echo "$out"
        echo "$out" | grep -q "no problems found"

  lua:check:hypr:
    desc: Type-check the Hyprland Lua config
    cmds:
      - |
        out=$("{{.LUA_LS}}" --check configs/hypr 2>&1)
        echo "$out"
        echo "$out" | grep -q "no problems found"

  tmux:reload:
    desc: Reload tmux config
    cmds:
      - |
        if tmux info >/dev/null 2>&1; then
          echo 'sourcing tmux conf...'
          tmux source ~/.config/tmux/tmux.conf
        else
          echo 'no tmux session to reload'
        fi

  tmux:tpm-setup:
    desc: Setup tmux plugin manager
    cmds:
      - git clone https://github.com/tmux-plugins/tpm "$HOME/.tmux/plugins/tpm"
      - task: tmux:reload
    status:
      - test -e "$HOME/.tmux/plugins/tpm"

  tmux:tpm-install:
    desc: Install tpm plugins
    cmds:
      - "$HOME/.config/tmux/plugins/tpm/bin/install_plugins"

  claude:init:
    desc: Initialize Claude Code config (skip onboarding prompt)
    cmds:
      - cp dev-image/claude.json ~/.claude.json
    status:
      - test -e ~/.claude.json

  win:push:
    desc: Export Windows packages
    cmds:
      - mkdir -p {{.WIN_DIR}}
      - winget export --nowarn --output "{{.WINGET_FILE}}" --include-versions
      - scoop export > "{{.SCOOP_FILE}}"

  win:pull:
    desc: Import Windows packages
    preconditions:
      - test -f "{{.WINGET_FILE}}"
      - test -f "{{.SCOOP_FILE}}"
    cmds:
      - winget import --accept-package-agreements --ignore-unavailable --accept-source-agreements --import-file "{{.WINGET_FILE}}"
      - scoop import "{{.SCOOP_FILE}}"

  brave:apply:
    desc: Apply custom configs to every Brave profile listed in Local State
    # skip (don't fail) if Brave has never been launched here, so no Local State yet
    if: 'test -f "{{.BRAVE_LOCAL_STATE}}"'
    preconditions:
      - sh: "pgrep -x brave >/dev/null && exit 1 || exit 0"
        msg: "Brave is running — close it first. Brave rewrites Preferences from memory on exit, which would undo this apply."
    cmds:
      - |
        # jq can't parse JSONC comments, so blank out whole-line // comments into
        # a plain-JSON temp file first. Only leading-// lines are stripped, so
        # mid-string // (e.g. https:// in favicon URLs) is left intact.
        custom_json=$(mktemp)
        sed 's|^[[:space:]]*//.*||g' ./configs/brave/custom.jsonc > "$custom_json"

        # Brave persists profile dir names (e.g. "Default", "Profile 1") under
        # profile.info_cache in Local State. Iterate those rather than guessing
        # names like "Work-Profile" — profile dir != display name.
        jq -r '.profile.info_cache | keys[]' "{{.BRAVE_LOCAL_STATE}}" | while IFS= read -r profile_dir; do
          prefs="{{.BRAVE_DIR}}/$profile_dir/Preferences"
          if [ ! -f "$prefs" ]; then
            echo "SKIP: $profile_dir (no Preferences file)"
            continue
          fi
          tmpfile=$(mktemp)
          echo "using tmp file for brave: $tmpfile"
          jq -s '.[0] * .[1]' "$prefs" "$custom_json" > "$tmpfile"
          mv "$tmpfile" "$prefs"
          echo "OK:   $profile_dir"
        done
        rm -f "$custom_json"

  remmina:configure:
    desc: Apply Remmina preferences via crudini (skips if the pref file doesn't exist yet)
    cmds:
      - |
        if [ ! -f "{{.REMMINA_PREF}}" ]; then
          echo "remmina:configure — {{.REMMINA_PREF}} not found, skipping (launch Remmina once to generate it)"
          exit 0
        fi
        # set host key to F12
        crudini --set "{{.REMMINA_PREF}}" remmina_pref hostkey 65481
        # unbind the screenshot shortcut (0 = no key)
        crudini --set "{{.REMMINA_PREF}}" remmina_pref shortcutkey_screenshot 0

  codex:configure:
    desc: Apply Codex preferences via yq (skips if config.toml doesn't exist yet)
    cmds:
      - |
        if [ ! -f "{{.CODEX_CONFIG}}" ]; then
          echo "codex:configure — {{.CODEX_CONFIG}} not found, skipping (launch Codex once to generate it)"
          exit 0
        fi
        yq -i -p toml -o toml \
          '.features.hooks = true | del(.features.codex_hooks)' \
          "{{.CODEX_CONFIG}}"

  dev:build:
    desc: Build dev container
    cmd: docker build --file dev-image/Dockerfile.dev -t dev-image --progress=plain .

  dev:container:
    desc: Run a dev container
    cmds:
      - mkdir -p ~/yolo-exchange
      - docker run -it -v ~/yolo-exchange:/root/yolo-exchange -v ~/.claude/.credentials.json:/root/.claude/.credentials.json -v /tmp/notify-forward:/tmp/notify-forward {{.CLI_ARGS}} dev-image:latest zsh

  tailscale:get_acl:
    desc: Get current Tailscale ACL policy
    requires:
      vars: [TAILSCALE_API_KEY, TAILSCALE_TAILNET]
    cmd: >-
      http GET "https://api.tailscale.com/api/v2/tailnet/{{.TAILSCALE_TAILNET}}/acl"
      -a "{{.TAILSCALE_API_KEY}}:"
      Accept:application/hujson

  tailscale:api:
    desc: |
      Generic Tailscale API call. Auth is injected automatically.
      Usage: task tailscale:api -- <method> <url> [httpie args...]
      Examples:
        task tailscale:api -- GET https://api.tailscale.com/api/v2/tailnet/-/devices
        task tailscale:api -- GET https://api.tailscale.com/api/v2/tailnet/-/acl Accept:application/hujson
    requires:
      vars: [TAILSCALE_API_KEY]
    cmd: http -a "{{.TAILSCALE_API_KEY}}:" {{.CLI_ARGS}}

  tailscale:put_acl:
    desc: Apply Tailscale ACL policy from tailscale/acl.hujson
    requires:
      vars: [TAILSCALE_API_KEY, TAILSCALE_TAILNET]
    cmd: >-
      http POST "https://api.tailscale.com/api/v2/tailnet/{{.TAILSCALE_TAILNET}}/acl"
      -a "{{.TAILSCALE_API_KEY}}:"
      Content-Type:application/hujson
      < tailscale/acl.hujson

  docs:serve:
    desc: Serve the Rspress (MDX) docs locally on port 9653 (live reload + search)
    dir: mdx-docs
    cmds:
      - test -d node_modules || npm install
      - npx rspress dev --host 0.0.0.0 --port 9653

  port-dash:serve:
    desc: Run port-dash — service status dashboard on port 9999
    # Launch via `task` (not the bare binary) so tmux-resurrect — which whitelists
    # `task` — restores it on restart. Re-runs `task port-dash:serve`, cwd-independent.
    cmds:
      - "{{.HOME}}/.local/bin/port-dash"

  llm:keys:
    desc: Set LLM API keys from agenix secrets
    cmds:
      - llm keys set gemini --value "$(cat /run/agenix/llm-gemini-key)"

  secrets:edit:
    desc: |
      Edit an existing agenix secret. Usage: task secrets:edit -- <secret.age>
    # agenix has no default editor, so EDITOR must be set. root nix key required too.
    requires:
      vars: [CLI_ARGS]
    dir: ./secrets
    cmd: sudo EDITOR=nvim agenix -i /etc/ssh/ssh_host_ed25519_key -e {{.CLI_ARGS}}

  secrets:update:
    desc: update secrets with recipients list
    dir: ./secrets
    cmd: sudo agenix -r -i /etc/ssh/ssh_host_ed25519_key
